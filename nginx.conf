events {
    worker_connections 1024;
}

http {
    # Re-query Docker's internal DNS every 10s so nginx picks up container
    # IP changes after replica restarts.
    resolver 127.0.0.11 valid=10s;

    upstream app_backend {
        # ip_hash ensures all requests from the same client IP always route
        # to the same replica, which is required because the job store and
        # SSE connections are held in per-process memory.
        ip_hash;
        server app:3000;
    }

    # Global upstream timeouts — a download job with retries can take several
    # minutes; 1 hour prevents spurious upstream disconnects.
    proxy_connect_timeout 10s;
    proxy_read_timeout    3600s;
    proxy_send_timeout    3600s;

    server {
        listen 80;
        server_name _;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE progress stream — buffering must be disabled or the browser
        # never receives individual frames written by res.write().
        location /api/progress/ {
            proxy_pass http://app_backend;

            proxy_buffering   off;
            proxy_cache       off;
            proxy_set_header  X-Accel-Buffering no;

            # HTTP/1.1 + empty Connection header keeps the upstream TCP
            # connection alive so the SSE stream stays open.
            proxy_http_version 1.1;
            proxy_set_header   Connection '';

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Video proxy download — disable buffering so the browser starts
        # receiving bytes immediately; forward Range headers for resumable
        # downloads.
        location /api/proxy-download {
            proxy_pass http://app_backend;

            proxy_buffering  off;
            proxy_set_header Range    $http_range;
            proxy_set_header If-Range $http_if_range;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # All other routes (API + static assets).
        location / {
            proxy_pass http://app_backend;

            proxy_http_version 1.1;
            proxy_set_header   Connection '';
        }
    }
}
